# The Flutter template asks for an 8G heap, which the OS kills on a machine
# with 8G of RAM ("Gradle build daemon disappeared unexpectedly"). 2G is
# plenty for this app.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
